name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      release-tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG -match '^v(\d+(?:\.\d+){1,3})$') {
            "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            "version=" >> $env:GITHUB_OUTPUT
          }

      - name: Configure
        shell: pwsh
        run: |
          # Let CMake select the newest Visual Studio installed on the runner image.
          cmake -S . -B build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: |
          & .\build\Release\tapir_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found at $iscc" }
          $isccArgs = @('installer\tapir.iss')
          if ($env:APP_VERSION) { $isccArgs = @("/dAppVersion=$env:APP_VERSION") + $isccArgs }
          & $iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item 'installer\Output\tapir-setup.exe' 'dist\'
          Copy-Item 'build\Release\tapir.exe' 'dist\'

      - uses: actions/upload-artifact@v7
        with:
          name: tapir-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tapir-windows-x64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/tapir-setup.exe dist/tapir.exe --clobber
          else
            gh release create "$RELEASE_TAG" dist/tapir-setup.exe dist/tapir.exe \
              --title "tapir $RELEASE_TAG" --generate-notes --verify-tag
          fi
